parameters:

    name: CACHE_BLOCK_SIZE
    type: integer
    description: Size of a cache block, represented as a contiguous, naturally aligned power-of-two (or NAPOT) range of memory locations. Implementation-specific, but uniform throughout the system.
    constraints:
    power_of_two: true

    name: CACHE_CAPACITY
    type: integer
    description: Capacity of a cache. Implementation-specific.
    constraints: []

    name: CACHE_ORGANIZATION
    type: string
    description: Organization of a cache. Implementation-specific.
    constraints: []